name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check duplicate code
        run: npm run cpd

      - name: Upload duplicate-code report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copypaste-report
          path: copypaste/
          if-no-files-found: ignore

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format

      - name: Expo Doctor
        run: npm run doctor
